name: Update dependency

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.current_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Save Before Version
        id: before
        run: |
          BEFORE_VERSION=$(node -p "require('./package.json').version")
          echo "version=${BEFORE_VERSION}" >> $GITHUB_OUTPUT

      - run: npm install

      - name: Update dependency
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package }}"
          if [ -n "$PACKAGE_NAME" ]; then
            echo "Updating package: $PACKAGE_NAME"
            npm install ${PACKAGE_NAME}@latest
          else
            echo "No package specified, updating default dependency node-fs-parent..."
            npm install node-fs-parent@latest
          fi

      - name: Check for updates
        id: check
        run: |
          if ! git diff --quiet package.json; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version if updated
        if: steps.check.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update node-fs-parent to latest and bump version"
          git push

      - name: Publish to NPM
        if: steps.check.outputs.changed == 'true'
        run: node npmPublish.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate Summary
        if: always()
        run: |
          echo "### 🔄 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "* **Status**: ${{ job.status }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "* **Changes Detected & Pushed**: \`${{ steps.check.outputs.changed || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 NPM Publication Summary" >> $GITHUB_STEP_SUMMARY
            echo "* **Package**: \`${PACKAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Git Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
            echo "* **Before Publish Version**: \`${{ steps.before.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **After Publish Version**: \`${{ steps.current_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Status**: ✅ Successfully Published to NPM" >> $GITHUB_STEP_SUMMARY
            echo "* **Registry Link**: [npm Link](https://www.npmjs.com/package/${PACKAGE_NAME})" >> $GITHUB_STEP_SUMMARY
          fi

  notify-dependents:
    needs: update
    if: always() && needs.update.outputs.changed == 'true' && needs.update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify kschema-fs-api-gen-post-actions
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Warning: DISPATCH_TOKEN secret is not set. Skipping notification."
            exit 0
          fi
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keshavsoft/kschema-fs-api-gen-post-actions/dispatches \
            -d "{\"event_type\": \"publish-success\", \"client_payload\": {\"package\": \"kschema-fs-read-config\", \"version\": \"${{ needs.update.outputs.version }}\"}}"

      - name: Notify vs-code-ext-express-api-gen-post-actions
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Warning: DISPATCH_TOKEN secret is not set. Skipping notification."
            exit 0
          fi
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keshavsoft/vs-code-ext-express-api-gen-post-actions/dispatches \
            -d "{\"event_type\": \"parent_package_updated\", \"client_payload\": {\"package\": \"kschema-fs-read-config\", \"version\": \"${{ needs.update.outputs.version }}\"}}"
